<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixeve タイマー</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Helvetica Neue",Arial;
  background:#ffffff;
  text-align:center;
  margin:0;
}
h1{margin-top:28px;font-size:30px;}
#time-display{font-size:70px;margin:30px 0;}
.button-container{display:flex;justify-content:center;gap:14px;}
button{
  font-size:20px;padding:10px 26px;border:none;border-radius:12px;
  cursor:pointer;color:white;
}
#start-btn{background:#28a745;}
#pause-btn{background:#ffc107;color:#000;}
#stop-btn{background:#dc3545;}
#lock-btn{
  background:#6f42c1;
  margin-top:22px;
  padding:12px 32px;
}
select{font-size:18px;padding:6px;margin-top:20px;}
#total-time{margin-top:30px;font-size:22px;}
a{display:block;margin:30px 0;font-size:18px;text-decoration:none;color:#007aff;}
</style>
</head>

<body>
<h1>Fixeve タイマー</h1>

<label>タイマーモード：</label>
<select id="mode">
  <option value="countup">カウントアップ</option>
  <option value="pomodoro25">ポモドーロ 25/5</option>
  <option value="pomodoro50">ポモドーロ 50/10</option>
</select>

<div id="time-display">00:00:00</div>

<div class="button-container">
  <button id="start-btn">開始</button>
  <button id="pause-btn">中断</button>
  <button id="stop-btn">終了</button>
</div>

<button id="lock-btn">アプリロック</button>

<div id="total-time">今日の勉強時間：0時間 0分</div>

<a href="https://fixeve.github.io/fixeve-home/">ホームへ戻る</a>

<script>
/* ===== DOM取得（← これが抜けてた） ===== */
const startBtn = document.getElementById("start-btn");
const pauseBtn = document.getElementById("pause-btn");
const stopBtn  = document.getElementById("stop-btn");
const lockBtn  = document.getElementById("lock-btn");
const modeSel  = document.getElementById("mode");
const display  = document.getElementById("time-display");
const totalDisplay = document.getElementById("total-time");

/* ===== 状態 ===== */
let timer=null;
let mode="countup";
let phase="study";
let remaining=0;
let isRunning=false;
let phaseStartTime=null;
let flashing=false;

/* ===== 日本時間 ===== */
function getTodayKey(){
  const n=new Date();
  const j=new Date(n.getTime()+9*3600000);
  return j.toISOString().slice(0,10);
}
let totalTime=parseInt(localStorage.getItem("study_"+getTodayKey()))||0;

/* ===== 表示 ===== */
function fmt(sec){
  const h=Math.floor(sec/3600);
  const m=Math.floor(sec%3600/60);
  const s=sec%60;
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function updateTotal(){
  const h=Math.floor(totalTime/3600);
  const m=Math.floor(totalTime%3600/60);
  totalDisplay.textContent=`今日の勉強時間：${h}時間 ${m}分`;
}
updateTotal();

/* ===== イベント ===== */
startBtn.onclick=start;
pauseBtn.onclick=pause;
stopBtn.onclick=stopTimer;
lockBtn.onclick=()=>{ location.href="concentration://open"; };
modeSel.onchange=changeMode;

/* ===== 開始 ===== */
function start(){
  if(flashing){ stopFlash(); nextPhase(); return; }
  if(isRunning) return;
  isRunning=true;
  phaseStartTime=Date.now();
  timer=setInterval(tick,1000);
}

/* ===== 中断 ===== */
function pause(){
  if(!isRunning) return;
  clearInterval(timer);
  isRunning=false;
  addStudyTime();
}

/* ===== 終了 ===== */
function stopTimer(){
  clearInterval(timer);
  isRunning = false;

  // 勉強時間を確定して保存
  addStudyTime();

  // ホームへ移動
  window.location.href = "https://fixeve.github.io/fixeve-home/";
}

/* ===== 毎秒 ===== */
function tick(){
  if(mode==="countup"){
    remaining++;
    display.textContent=fmt(remaining);
    return;
  }
  remaining--;
  display.textContent=fmt(remaining);
  if(remaining<=0){
    clearInterval(timer);
    isRunning=false;
    startFlash();
  }
}

/* ===== 勉強時間加算 ===== */
function addStudyTime(){
  if(mode!=="countup" && phase!=="study") return;
  if(!phaseStartTime) return;
  totalTime+=Math.floor((Date.now()-phaseStartTime)/1000);
  localStorage.setItem("study_"+getTodayKey(),totalTime);
  updateTotal();
  phaseStartTime=null;
}

/* ===== フェーズ ===== */
function nextPhase(){
  if(mode==="countup") return;
  phase=(phase==="study")?"break":"study";
  remaining=
    mode==="pomodoro25"
      ? (phase==="study"?1500:300)
      : (phase==="study"?3000:600);
  display.textContent=fmt(remaining);
}

/* ===== モード変更 ===== */
function changeMode(){
  pause();
  mode=this.value;
  phase="study";
  remaining=
    mode==="countup"?0:
    mode==="pomodoro25"?1500:3000;
  display.textContent=fmt(remaining);
}

/* ===== 光 ===== */
function startFlash(){
  flashing=true;
  let i=0;
  timer=setInterval(()=>{
    document.body.style.background=(i++%2)?"#d8b3ff":"#aaffaa";
  },160);
}
function stopFlash(){
  clearInterval(timer);
  flashing=false;
  document.body.style.background="#fff";
}
</script>
</body>
</html>
